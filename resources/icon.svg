<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1E1B4B" flood-opacity=".35"/>
    </filter>
  </defs>
  <!-- macOS-style rounded square -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#shine)"/>
  <g filter="url(#shadow)" stroke-linejoin="round">
    <!-- lower container -->
    <path d="M128 112 L196 146 L196 186 L128 220 L60 186 L60 146 Z" fill="#E0E7FF"/>
    <path d="M128 152 L196 118 L196 186 L128 220 Z" fill="#C7D2FE"/>
    <path d="M128 152 L60 118 L60 186 L128 220 Z" fill="#FFFFFF"/>
    <path d="M128 84 L196 118 L128 152 L60 118 Z" fill="#EEF2FF"/>
    <!-- ribs on the lower container -->
    <g stroke="#A5B4FC" stroke-width="5" stroke-linecap="round">
      <path d="M78 138 L78 186"/><path d="M96 147 L96 195"/><path d="M114 156 L114 204"/>
      <path d="M142 156 L142 204"/><path d="M160 147 L160 195"/><path d="M178 138 L178 186"/>
    </g>
    <!-- upper container -->
    <path d="M128 98 L176 74 L176 104 L128 128 Z" fill="#C7D2FE"/>
    <path d="M128 98 L80 74 L80 104 L128 128 Z" fill="#FFFFFF"/>
    <path d="M128 50 L176 74 L128 98 L80 74 Z" fill="#EEF2FF"/>
    <g stroke="#A5B4FC" stroke-width="4" stroke-linecap="round">
      <path d="M96 87 L96 108"/><path d="M112 95 L112 116"/>
      <path d="M144 95 L144 116"/><path d="M160 87 L160 108"/>
    </g>
  </g>
</svg>
